spring:
  application:
    name: doc-intelligence-api

  datasource:
    url: jdbc:postgresql://localhost:5432/docdb
    username: docuser
    password: docpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
